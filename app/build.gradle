plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nugggets.linkrepeater'
    compileSdk 34
    defaultConfig {
        applicationId "com.nugggets.linkrepeater"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
